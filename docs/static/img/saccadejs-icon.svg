<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"
     role="img" aria-label="saccade.js">
  <!--
    Favicon variant of the scanpath mark: the same geometry scaled up 10% about
    the centre, trading margin for stroke weight because a favicon is read at
    16px where margin is wasted and weight is everything.
  -->
